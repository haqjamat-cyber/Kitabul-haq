name: Download Urdu Kanzul Iman

on:
  workflow_dispatch:

jobs:
  fetch-urdu:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Kanzul Iman Urdu JSON
        run: |
          python3 - << 'EOF'
          import json, time, urllib.request

          def fetch_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          result = {}
          try:
              data = fetch_json("https://api.alquran.cloud/v1/quran/ur.kanzuliman")
              for s in data["data"]["surahs"]:
                  result[str(s["number"])] = {str(a["numberInSurah"]): a["text"] for a in s["ayahs"]}
          except Exception as e:
              print("Bulk fetch failed, trying surah by surah:", e)
              for s_num in range(1, 115):
                  for _ in range(3):
                      try:
                          d = fetch_json(f"https://api.alquran.cloud/v1/surah/{s_num}/ur.kanzuliman")
                          result[str(s_num)] = {str(a["numberInSurah"]): a["text"] for a in d["data"]["ayahs"]}
                          break
                      except Exception:
                          time.sleep(2)

          assert len(result) == 114, f"Sirf {len(result)} surahs aayi"
          with open("ur_kanzuliman.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False)
          print("Done! Total surahs:", len(result))
          EOF

      - name: Upload JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ur_kanzuliman
          path: ur_kanzuliman.json
          
